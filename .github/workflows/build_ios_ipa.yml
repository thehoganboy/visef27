name: Build Unsigned iOS IPA (iPhone 14 Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Native iOS IPA (macOS Latest)
    runs-on: macos-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install CoreML Exporter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision timm coremltools onnx numpy

      - name: Export MiDaS to Core ML (DepthModel.mlpackage)
        run: |
          python ios/scripts/export_coreml.py

      - name: Generate Xcode Project via XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          cd ios
          xcodegen generate

      - name: Compile iOS Application (Unsigned Release)
        run: |
          cd ios
          xcodebuild -project HorusEyes.xcodeproj \
            -scheme HorusEyes \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package App into Sideloadly-Ready IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HorusEyes.app Payload/
          # Guarantee all camera, audio and sensor privacy permissions are in Info.plist
          cp HorusEyes/Info.plist Payload/HorusEyes.app/Info.plist
          echo "=== Verified Final App Info.plist ==="
          plutil -p Payload/HorusEyes.app/Info.plist
          zip -qq -r HorusEyes_iOS.ipa Payload
          ls -la HorusEyes_iOS.ipa

      - name: Upload HorusEyes IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusEyes-iPhone14-IPA
          path: ios/HorusEyes_iOS.ipa
          if-no-files-found: error
