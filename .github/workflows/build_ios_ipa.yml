name: Build Unsigned iOS IPA (iPhone 14 Sideloadly)

on:
  push:
    branches: [ main, master, feature/demo-ready-unified-ux, feature/ios-trimode-depth-prototype ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Native iOS IPA (macOS Latest)
    runs-on: macos-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Default Xcode
        run: |
          echo "=== Active Xcode Version ==="
          xcodebuild -version
          xcode-select -p

      - name: Run portable depth prototype tests
        run: |
          swiftc ios/HorusEyes/Vision/DepthFrame.swift ios/tests/DepthPrototypeTests.swift -o /tmp/depth-prototype
          /tmp/depth-prototype
          swiftc ios/HorusEyes/Vision/StereoCalibration.swift ios/tests/StereoCalibrationTests.swift -o /tmp/stereo-calibration
          /tmp/stereo-calibration

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install CoreML Exporter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.0.0,<2.5.0" "torchvision>=0.15.0,<0.20.0" "timm==0.6.13" "coremltools==8.3.0" "numpy<2.0.0" "onnxruntime" "Pillow"

      - name: Pre-cache MiDaS PyTorch Weights and Architecture
        run: |
          mkdir -p ~/.cache/torch/hub/checkpoints
          mkdir -p ios/scripts
          echo "=== Pre-downloading MiDaS small weights via curl with retry ==="
          curl -fL --retry 5 --retry-delay 3 -H "User-Agent: Mozilla/5.0" \
            -o ~/.cache/torch/hub/checkpoints/midas_v21_small_256.pt \
            "https://github.com/isl-org/MiDaS/releases/download/v2_1/midas_v21_small_256.pt"
          cp ~/.cache/torch/hub/checkpoints/midas_v21_small_256.pt ios/scripts/midas_v21_small_256.pt
          ls -la ~/.cache/torch/hub/checkpoints/midas_v21_small_256.pt ios/scripts/midas_v21_small_256.pt
          SIZE=$(wc -c < ios/scripts/midas_v21_small_256.pt | tr -d ' ')
          echo "Downloaded weights size: $SIZE bytes"
          [ "$SIZE" -gt 50000000 ] || { echo "FATAL: Weights file too small ($SIZE bytes)"; exit 1; }

          echo "=== Pre-cloning MiDaS repository to local cache ==="
          git clone https://github.com/isl-org/MiDaS.git ios/scripts/MiDaS
          git -C ios/scripts/MiDaS checkout 454597711a62eabcbf7d1e89f3fb9f569051ac9b
          git clone https://github.com/rwightman/gen-efficientnet-pytorch.git ios/scripts/efficientnet
          git -C ios/scripts/efficientnet checkout 771ce082b2ce6d033f55b3d47c1f77389ad3c180
          echo "70d6b9c891758c67f974a6097fb0c608c7ee67fb81ac3e5588847d5596d56fca  ios/scripts/midas_v21_small_256.pt" | shasum -a 256 -c -

      - name: Run native Swift behavior regressions
        run: |
          set -euo pipefail
          echo "=== Compiling native Swift behavior regressions ==="
          swiftc ios/HorusEyes/Config.swift ios/HorusEyes/Math/PchipInterpolator.swift ios/HorusEyes/Vision/DepthEngine.swift ios/HorusEyes/Vision/DepthFrame.swift ios/HorusEyes/Vision/MetricSpatialObservation.swift ios/HorusEyes/Kinematics/KinematicsEngine.swift ios/HorusEyes/Budget/AuditoryBudgetManager.swift ios/HorusEyes/UI/DirectionalAdvisory.swift ios/tests/BehaviorTests.swift -o /tmp/horus-behavior 2>&1 | tee swiftc.log || {
            echo "FATAL: swiftc compilation failed"
            cat swiftc.log
            exit 1
          }
          echo "=== Running native Swift behavior regressions ==="
          /tmp/horus-behavior 2>&1 | tee behavior.log || {
            echo "FATAL: native Swift behavior regression execution failed"
            cat behavior.log
            exit 1
          }

      - name: Export MiDaS to Core ML (DepthModel.mlpackage)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python ios/scripts/export_coreml.py > export.log 2>&1 || {
            echo "=== COREML EXPORTER FAILED! LOG DUMP: ==="
            cat export.log
            echo "::error file=ios/scripts/export_coreml.py::$(tail -n 20 export.log | tr '\n' ' ')"
            echo "### CoreML Exporter Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat export.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cat export.log
          echo "### CoreML Exporter Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat export.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          test -d ios/HorusEyes/DepthModel.mlpackage || (echo "FATAL: DepthModel.mlpackage was not created by export_coreml.py!" && exit 1)
          echo "=== Verified Core ML DepthModel.mlpackage ==="
          ls -ld ios/HorusEyes/DepthModel.mlpackage

      - name: Upload CoreML Exporter Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-export-log
          path: |
            export.log
            ios/model_parity.json
            swiftc.log
            behavior.log
          if-no-files-found: ignore

      - name: Generate Xcode Project via XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          cd ios
          xcodegen generate

      - name: Compile iOS Application (Unsigned Release)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project HorusEyes.xcodeproj \
            -scheme HorusEyes \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED! COMPILATION LOG DUMP: ==="
              grep -E "error:" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Upload Xcodebuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore

      - name: Package App into Sideloadly-Ready IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HorusEyes.app Payload/

          # Compile CoreML DepthModel into the app bundle
          echo "=== Compiling CoreML DepthModel with xcrun coremlcompiler ==="
          xcrun coremlcompiler compile HorusEyes/DepthModel.mlpackage Payload/HorusEyes.app/
          test -d Payload/HorusEyes.app/DepthModel.mlmodelc || (echo "FATAL: DepthModel.mlmodelc missing from app bundle!" && exit 1)
          ls -ld Payload/HorusEyes.app/DepthModel.mlmodelc

          # Ensure Info.plist has strictly resolved values for Sideloadly / AltStore
          python3 -c "
          import plistlib
          p = 'Payload/HorusEyes.app/Info.plist'
          with open(p, 'rb') as f:
              pl = plistlib.load(f)
          pl['CFBundleExecutable'] = 'HorusEyes'
          pl['CFBundleIdentifier'] = 'com.visef.horuseyes'
          pl['CFBundleName'] = 'VAMPIOR'
          pl['CFBundleDisplayName'] = 'VAMPIOR'
          pl['CFBundleDevelopmentRegion'] = 'en'
          pl['CFBundleShortVersionString'] = '3.1'
          pl['CFBundleVersion'] = '1'
          pl['CFBundlePackageType'] = 'APPL'
          pl['LSRequiresIPhoneOS'] = True
          pl['MinimumOSVersion'] = '16.0'
          pl['UIRequiredDeviceCapabilities'] = ['arm64']
          pl['UILaunchScreen'] = {}
          pl['UISupportedInterfaceOrientations'] = ['UIInterfaceOrientationPortrait']
          pl['NSCameraUsageDescription'] = 'HorusEyes uses the rear camera to detect obstacles and guide you safely in real-time.'
          pl['NSMicrophoneUsageDescription'] = 'HorusEyes requires audio session access for spatial sound feedback.'
          pl['NSMotionUsageDescription'] = 'HorusEyes uses motion sensors to distinguish head turns from obstacle approach.'
          with open(p, 'wb') as f:
              plistlib.dump(pl, f)
          "
          chmod +x Payload/HorusEyes.app/HorusEyes
          echo "=== Verified Final App Info.plist ==="
          plutil -p Payload/HorusEyes.app/Info.plist
          zip -qq -r HorusEyes_iPhone14Pro.ipa Payload
          unzip -tq HorusEyes_iPhone14Pro.ipa
          lipo Payload/HorusEyes.app/HorusEyes -verify_arch arm64
          ls -la HorusEyes_iPhone14Pro.ipa
          ipa_size=$(wc -c < HorusEyes_iPhone14Pro.ipa | tr -d ' ')
          echo "=== Final IPA Size: $ipa_size bytes ==="
          if [ "$ipa_size" -lt 5000000 ]; then
            echo "FATAL: IPA size is less than 5MB ($ipa_size bytes)! Neural weights are missing!"
            exit 1
          fi

      - name: Upload HorusEyes IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusEyes-iPhone14Pro-Clean
          path: ios/HorusEyes_iPhone14Pro.ipa
          if-no-files-found: error
