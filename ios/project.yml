name: HorusEyes
options:
  bundleIdPrefix: com.visef.horuseyes
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  projectFormat: xcode15_0
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only
    ENABLE_BITCODE: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Release:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      AD_HOC_CODE_SIGNING_ALLOWED: "YES"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  HorusEyes:
    type: application
    platform: iOS
    sources:
      - path: HorusEyes
        excludes:
          - "*.md"
    info:
      path: HorusEyes/Info.plist
      properties:
        CFBundleExecutable: "HorusEyes"
        CFBundleIdentifier: "com.visef.horuseyes"
        CFBundleName: "VAMPIOR"
        CFBundleDisplayName: "VAMPIOR"
        CFBundleDevelopmentRegion: "en"
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
        UILaunchScreen: {}
        NSCameraUsageDescription: "VAMPIOR uses the rear camera to detect obstacles and guide you safely in real-time."
        NSMicrophoneUsageDescription: "VAMPIOR requires audio session access for spatial sound feedback."
        NSMotionUsageDescription: "VAMPIOR uses motion sensors to distinguish head turns from obstacle approach."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visef.horuseyes
        INFOPLIST_FILE: HorusEyes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: HorusEyes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
